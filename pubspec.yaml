name: wffrhasah
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.9+10

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  intl: any
  # Supabase
  supabase_flutter: ^2.10.1
  sign_in_with_apple: ^8.1.0

  # UI & Animations
  lottie: ^3.3.2
  flutter_svg: ^2.2.3
  carousel_slider: ^5.1.1
  cached_network_image: ^3.4.1
  smooth_page_indicator: ^2.0.1
  google_fonts: ^8.0.0
  custom_navigation_bar: ^0.8.2

  # State Management & Storage
  provider: ^6.1.2
  shared_preferences: ^2.5.3

  # Utilities
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  crypto: ^3.0.6
  image_picker: ^1.2.0
  package_info_plus: ^10.2.1
  permission_handler: ^12.0.1

  # Firebase
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.3

flutter_native_splash:
  color: "#ffffff"
  android_12:
    color: "#ffffff"

flutter:
  uses-material-design: true

  assets:
    - assets/animations/coupon_animation.json
    - assets/image/
    - assets/icon/
    - assets/icon/like.png
    - assets/icon/nolike.png
    - assets/lang/ar.json
    - assets/lang/en.json


  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
